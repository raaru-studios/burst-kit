# BURST MANIFEST voidrunner-only — DRAFT 2026-11-10 (prep only, no launch).
# VOIDRUNNER-only push: BUILD + EMULATE + VERIFY for the native rebuild,
# without waiting on the suite push's prep queue (25 org repos, 50 unpinned
# refs, interrupted DeepSeek pass-2). Modeled on draft-camp-1.yaml (same
# box, cap, ceiling, job shapes). Price ceiling $1.25/h is an orchestrator
# flag (--price-ceiling, default 1.25), not a manifest field.
#
# PIN: raaruofficial/voidrunner @ c1d923e63030287a7e8b223dc1b09bfd9b0226f4
#   (native rebuild 1.1.0/vc14, pushed 2026-11-12T01:11:02Z, [skip ci];
#   35 Kotlin files, 0 WebView, MWA 2.0.8 pinned, identity
#   https://voidrunner.raaru.app, favicon.ico live at the custom domain.)
#   The old pin c1d923e63030287a7e8b223dc1b09bfd9b0226f4 (v1.0.3 WebView)
#   is superseded.
#
# BLOCKERS — RESOLVED 2026-11-12 by the rebuild push:
#   1. REBUILD PUSHED (017d047) — re-pinned below.
#   2. GRADLE WRAPPER present (Gradle 8.11) — committed at repo root.
#   3. NO TEST SOURCES — BUILD remains assembleDebug only (known limit).
#   4. BATTERY SCRIPT committed at repo root (cold-run-battery.sh).
#   5. PRIVATE-REPO CLONE CREDENTIAL — STILL OPEN (no per-campaign
#      read-only GitHub credential exists; orchestrator clones plain
#      https with no token injection). Every job fails at clone until
#      one is designated + injected.
#   6. MWA PINNED 2.0.8 (app/build.gradle.kts:57).
#   7. IDENTITY PATCH applied — identityUri https://voidrunner.raaru.app;
#      Pages custom domain voidrunner.raaru.app set + verified serving
#      (favicon.ico HTTP 200). The res/ resources (launcher icon, theme)
#      were restored from the repo HEAD — the rebuild ships no res/ of
#      its own, and the manifest requires @mipmap/ic_launcher +
#      @style/Theme.Voidrunner.
# Cap $8, box m8i.12xlarge, max_hours 6 — as SPEC §11a.
# Fold-in: job ids are voidrunner-* (no collision with suite ids) and lane
# is `voidrunner`; to fold into draft-camp-1.yaml, copy these three jobs,
# re-pin to the rebuild HEAD, and re-estimate the campaign cost (the $8 cap
# already carries the suite estimate of $3.50–$5.50; these jobs add roughly
# $1.50–$3.00 of box time in the same push's waves).
campaign: voidrunner-only
budget_cap_usd: 8  # owner-set per SPEC §11a single-push adoption
box: { type: m8i.12xlarge, region: us-west-2, max_hours: 6 }
jobs:
  # voidrunner-l1l2 — BUILD: assemble the debug APK. No test leg exists
  # (no test sources); ./gradlew works — the wrapper (Gradle 8.11) is
  # committed at repo root in the pinned rebuild HEAD.
  - id: voidrunner-l1l2
    lane: voidrunner
    kind: BUILD
    repo: raaruofficial/voidrunner
    ref: c1d923e63030287a7e8b223dc1b09bfd9b0226f4
    run: ./gradlew assembleDebug
    timeout_min: 40
    produces: ["*.apk"]
    custody: none
  # voidrunner-l3 — EMULATE: estate cold-run battery (cold-run-battery.sh,
  # committed at repo root in the pinned rebuild HEAD) against the BUILD
  # leg's debug APK, with the §5.1 wait (APK_WAIT_S=5400, fail-fast if
  # BUILD fails).
  # The debug APK's applicationId is com.voidrunner.app — the app
  # build.gradle.kts carries NO applicationIdSuffix, so there is no
  # .debug suffix (verified 2026-11-11 firsthand from the pushed tree);
  # the battery auto-detects the package from the gradle file.
  - id: voidrunner-l3
    lane: voidrunner
    kind: EMULATE
    repo: raaruofficial/voidrunner
    ref: c1d923e63030287a7e8b223dc1b09bfd9b0226f4
    run: APK="$BURST_OUT/jobs/voidrunner-l1l2/evidence/*.apk/app/build/outputs/apk/debug/*.apk" APK_WAIT_S=5400 APK_WAIT_BUILD_ID=voidrunner-l1l2 ./cold-run-battery.sh
    timeout_min: 150
    produces: [cold-run-report, logcat.txt]
    custody: none
  # voidrunner-verify — VERIFY: source-truth gate, self-contained (no APK
  # needed, no ordering dependency on the BUILD leg). Passes only when the
  # tree is the native rebuild with a controlled identity: no WebView
  # anywhere in the Kotlin sources, the MWA clientlib present, and the
  # wallet identity pointing at a domain the estate controls
  # (voidrunner.raaru.app or raaruofficial.github.io/voidrunner).
  # Pinned to the rebuild HEAD 017d047 — this job is expected to PASS.
  # The binary-level listing-truth audit
  # (LIBRARIAN method) happens back home from the BUILD evidence, not here.
  - id: voidrunner-verify
    lane: voidrunner
    kind: VERIFY
    repo: raaruofficial/voidrunner
    ref: c1d923e63030287a7e8b223dc1b09bfd9b0226f4
    run: '! grep -rq "android.webkit" app/src/main/java/ && grep -q "mobile-wallet-adapter" app/build.gradle.kts && grep -Eq "voidrunner.raaru.app|raaruofficial.github.io/voidrunner" app/src/main/java/com/voidrunner/app/wallet/WalletManager.kt && echo VOIDRUNNER-VERIFY-OK > verify-report.txt'
    timeout_min: 15
    produces: [verify-report.txt]
    custody: none
